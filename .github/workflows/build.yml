name: Windows portable build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compile portable executable
        shell: powershell
        run: ./source/build.ps1
      - name: Package clean portable files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist/WindowLayers | Out-Null
          Copy-Item WindowLayers.exe,LICENSE,README.md,README.en.md dist/WindowLayers/
          Copy-Item -Recurse docs dist/WindowLayers/docs
          Compress-Archive -Path dist/WindowLayers -DestinationPath dist/WindowLayers-Windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WindowLayers-Windows-portable
          path: dist/WindowLayers-Windows-portable.zip
          if-no-files-found: error
